<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Page Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-store.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      color: #111827;
      font-family: Inter, system-ui, sans-serif;
    }
    .app-shell {
      display: block;
      height: 100%;
    }
    .topbar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      padding: 0.75rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
      z-index: 9999;
    }
    #preview-root {
      width: 100%;
      height: 100%;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    .topbar .button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 2rem;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    .empty-state p {
      margin: 0.75rem 0 0;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="preview-root">
      <div id="preview-skeleton" class="empty-state">
        <div>
          <strong>Loading preview...</strong>
          <p>Preparing this page for full-screen viewing.</p>
        </div>
      </div>
      <div id="empty-state" class="empty-state hidden">
        <div>
          <strong>No preview content available.</strong>
          <p>Please open the full-page preview from the HTML editor.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const storagePrefix = "fullPagePreviewToken:";
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const chapter = params.get("chapter");
    const bookId = params.get("bookId");
    const chapterId = params.get("chapterId");
    const urlStudentMode = params.get("studentMode") === "1";
    const urlTeacherMode = params.get("teacherMode") === "1";
    function getSameOriginReferrer() {
      try {
        if (!document.referrer) return "";
        const referrerUrl = new URL(document.referrer);
        if (referrerUrl.origin !== window.location.origin) return "";
        return referrerUrl.pathname.split("/").pop() + referrerUrl.search + referrerUrl.hash;
      } catch (error) {
        return "";
      }
    }

    const returnTo = params.get("returnTo") || getSameOriginReferrer() || "index.html";
    const returnLabel = params.get("returnLabel") || "Back";
    const emptyState = document.getElementById("empty-state");
    const previewSkeleton = document.getElementById("preview-skeleton");

    function hidePreviewSkeleton() {
      previewSkeleton?.classList.add("hidden");
    }

    function showError() {
      hidePreviewSkeleton();
      emptyState.classList.remove("hidden");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function shouldUseStudentCopy(activity, entry) {
      return Boolean(activity);
    }

    let loaded = false;

    function scriptSafeJson(value) {
      return JSON.stringify(value).replace(/<\/script/gi, "<\\/script");
    }

    function addFloatingReturnButton() {
      const existingButton = document.getElementById("digitxt-return-button");
      if (existingButton) return;

      const link = document.createElement("a");
      link.id = "digitxt-return-button";
      link.href = returnTo;
      link.target = "_top";
      link.textContent = returnLabel;
      link.style.position = "fixed";
      link.style.top = "1rem";
      link.style.right = "1rem";
      link.style.zIndex = "2147483647";
      link.style.background = "#2563eb";
      link.style.color = "#ffffff";
      link.style.border = "1px solid #1d4ed8";
      link.style.borderRadius = "999px";
      link.style.padding = "0.65rem 1rem";
      link.style.font = "600 0.875rem Inter, system-ui, sans-serif";
      link.style.textDecoration = "none";
      link.style.boxShadow = "0 10px 24px rgba(15, 23, 42, 0.16)";
      document.body.appendChild(link);
    }

    function buildFloatingControlsScript(payload) {
      const activityContext = {
        studentMode: Boolean(payload?.studentMode),
        chapterBookId: payload?.chapterBookId || "",
        chapterId: payload?.chapterId || "",
        bookTitle: payload?.bookTitle || "",
        chapterTitle: payload?.chapterTitle || "",
        chapterSavedAt: payload?.chapterSavedAt || "",
        useSavedSnapshot: Boolean(payload?.useSavedSnapshot),
        notes: payload?.notes || "",
        activityState: payload?.activityState || {}
      };

      return `<script>
        (function () {
          var existingButton = document.getElementById("digitxt-return-button");
          function readCurrentUser() {
            if (window.DigitxtStore && window.DigitxtStore.getSession) {
              return window.DigitxtStore.getSession();
            }

            try {
              return JSON.parse(localStorage.getItem("digitxtUser") || "null");
            } catch (error) {
              return null;
            }
          }

          var currentUser = readCurrentUser();
          var activityContext = ${scriptSafeJson(activityContext)};

          function styleButton(button, background, borderColor) {
            button.style.background = background;
            button.style.color = "#ffffff";
            button.style.border = "1px solid " + borderColor;
            button.style.borderRadius = "999px";
            button.style.padding = "0.65rem 1rem";
            button.style.font = "600 0.875rem Inter, system-ui, sans-serif";
            button.style.textDecoration = "none";
            button.style.boxShadow = "0 10px 24px rgba(15, 23, 42, 0.16)";
            button.style.cursor = "pointer";
          }

          function ensureControls() {
            var controls = document.getElementById("digitxt-page-controls");
            if (controls) return controls;

            controls = document.createElement("div");
            controls.id = "digitxt-page-controls";
            controls.style.position = "fixed";
            controls.style.top = "1rem";
            controls.style.right = "1rem";
            controls.style.zIndex = "2147483647";
            controls.style.display = "flex";
            controls.style.alignItems = "center";
            controls.style.gap = "0.5rem";
            document.body.appendChild(controls);
            return controls;
          }

          function serializeCurrentPage() {
            var clone = document.documentElement.cloneNode(true);
            ["digitxt-page-controls", "digitxt-return-button", "digitxt-save-activity-button", "digitxt-activity-status"].forEach(function (id) {
              clone.querySelectorAll("#" + id).forEach(function (element) {
                element.remove();
              });
            });
            clone.querySelectorAll("script").forEach(function (script) {
              var src = script.getAttribute("src") || "";
              var code = script.textContent || "";
              if (
                src.includes("supabase-js") ||
                src.includes("supabase-config.js") ||
                src.includes("supabase-store.js") ||
                code.includes("digitxt-save-activity-button") ||
                code.includes("digitxt-page-controls")
              ) {
                script.remove();
              }
            });

            var liveFields = document.querySelectorAll("input, textarea, select");
            var clonedFields = clone.querySelectorAll("input, textarea, select");
            var activityState = { fields: [], savedUrl: window.location.href };

            liveFields.forEach(function (field, index) {
              var clonedField = clonedFields[index];
              if (!clonedField) return;
              var key = field.name || field.id || "field-" + index;

              if (field.tagName === "TEXTAREA") {
                clonedField.textContent = field.value;
                activityState.fields.push({ key: key, index: index, type: "textarea", value: field.value });
                return;
              }

              if (field.tagName === "SELECT") {
                Array.prototype.forEach.call(clonedField.options, function (option) {
                  option.removeAttribute("selected");
                });
                Array.prototype.forEach.call(field.options, function (option, optionIndex) {
                  if (option.selected && clonedField.options[optionIndex]) {
                    clonedField.options[optionIndex].setAttribute("selected", "selected");
                  }
                });
                activityState.fields.push({ key: key, index: index, type: "select", value: field.value });
                return;
              }

              if (field.type === "checkbox" || field.type === "radio") {
                if (field.checked) {
                  clonedField.setAttribute("checked", "checked");
                } else {
                  clonedField.removeAttribute("checked");
                }
                activityState.fields.push({ key: key, index: index, type: field.type, value: field.value, checked: field.checked });
                return;
              }

              clonedField.setAttribute("value", field.value);
              activityState.fields.push({ key: key, index: index, type: field.type || "text", value: field.value });
            });

            var liveEditables = document.querySelectorAll("[contenteditable]");
            var clonedEditables = clone.querySelectorAll("[contenteditable]");
            liveEditables.forEach(function (element, index) {
              if (clonedEditables[index]) {
                clonedEditables[index].innerHTML = element.innerHTML;
              }
              activityState.fields.push({
                key: element.id || "contenteditable-" + index,
                index: index,
                type: "contenteditable",
                value: element.innerHTML
              });
            });

            return {
              content: "<!DOCTYPE html>\\n" + clone.outerHTML,
              activityState: activityState
            };
          }

          function findFieldByKey(key, fallbackIndex) {
            var fields = document.querySelectorAll("input, textarea, select");
            var fallbackField = fields[fallbackIndex] || null;
            if (fallbackField && (fallbackField.name || fallbackField.id || "field-" + fallbackIndex) === key) {
              return fallbackField;
            }

            var matches = [];
            for (var i = 0; i < fields.length; i += 1) {
              if ((fields[i].name || fields[i].id || "field-" + i) === key) {
                matches.push(fields[i]);
              }
            }
            if (matches.length > 1 && fallbackField && Array.prototype.indexOf.call(matches, fallbackField) !== -1) {
              return fallbackField;
            }
            return matches[0] || fallbackField;
          }

          function applySavedActivityState() {
            var state = activityContext.activityState || {};
            var fields = Array.isArray(state.fields) ? state.fields : [];

            fields.forEach(function (savedField, index) {
              if (!savedField || !savedField.type) return;

              if (savedField.type === "contenteditable") {
                var editableIndex = savedField.index !== undefined ? savedField.index : index;
                var editables = document.querySelectorAll("[contenteditable]");
                var indexedEditable = editables[editableIndex] || null;
                var editable = null;
                if (indexedEditable && (indexedEditable.id || "contenteditable-" + editableIndex) === savedField.key) {
                  editable = indexedEditable;
                }
                if (!editable && savedField.key) {
                  editable = document.getElementById(savedField.key);
                }
                editable = editable || indexedEditable;
                if (editable) {
                  editable.innerHTML = savedField.value || "";
                }
                return;
              }

              var field = findFieldByKey(savedField.key, savedField.index !== undefined ? savedField.index : index);
              if (!field) return;

              if (savedField.type === "checkbox" || savedField.type === "radio") {
                field.checked = Boolean(savedField.checked);
              } else if (field.tagName === "SELECT") {
                field.value = savedField.value || "";
                Array.prototype.forEach.call(field.options, function (option) {
                  option.selected = option.value === field.value;
                });
              } else {
                field.value = savedField.value || "";
              }

              try {
                field.dispatchEvent(new Event("input", { bubbles: true }));
                field.dispatchEvent(new Event("change", { bubbles: true }));
              } catch (error) {
                // Older embedded pages can ignore synthetic events.
              }
            });
          }

          function showStatus(message, color) {
            var status = document.getElementById("digitxt-activity-status");
            if (!status) {
              status = document.createElement("div");
              status.id = "digitxt-activity-status";
              status.style.position = "fixed";
              status.style.top = "4.25rem";
              status.style.right = "1rem";
              status.style.zIndex = "2147483647";
              status.style.padding = "0.55rem 0.75rem";
              status.style.borderRadius = "0.5rem";
              status.style.font = "600 0.8rem Inter, system-ui, sans-serif";
              status.style.boxShadow = "0 10px 24px rgba(15, 23, 42, 0.16)";
              document.body.appendChild(status);
            }
            status.textContent = message;
            status.style.background = color === "error" ? "#fef2f2" : "#ecfdf5";
            status.style.color = color === "error" ? "#b91c1c" : "#047857";
            status.style.border = color === "error" ? "1px solid #fecaca" : "1px solid #a7f3d0";
            window.setTimeout(function () {
              if (status) status.remove();
            }, 3000);
          }

          var controls = ensureControls();
          var digitxtNoteBlocks = {};

          function generateNoteId() {
            return "note-" + Math.random().toString(36).slice(2, 11);
          }

          function loadExternalScript(src) {
            return new Promise(function (resolve) {
              var existing = Array.prototype.find.call(document.scripts, function (script) {
                return script.src === src;
              });
              if (existing) {
                resolve();
                return;
              }
              var script = document.createElement("script");
              script.src = src;
              script.onload = resolve;
              script.onerror = resolve;
              document.head.appendChild(script);
            });
          }

          function parseNotesDocument() {
            var rawNotes = activityContext.notes || activityContext.activityState?.notes || "";
            if (activityContext.activityState?.noteDocument) {
              return activityContext.activityState.noteDocument;
            }
            if (rawNotes) {
              try {
                var parsed = JSON.parse(rawNotes);
                if (parsed && parsed.type === "digitxt-note-document" && Array.isArray(parsed.blocks)) {
                  return parsed;
                }
              } catch (error) {
                // Plain legacy notes are converted below.
              }
            }
            return {
              type: "digitxt-note-document",
              version: 1,
              title: "",
              blocks: rawNotes ? [{ type: "text", html: String(rawNotes).replace(/\\n/g, "<br>") }] : []
            };
          }

          function drawGraphOnContext(ctx, data, width, height) {
            var settings = data?.settings || { xMin: -5, xMax: 5, yMin: -10, yMax: 30, xStep: 1, yStep: 5 };
            var xMin = Number(settings.xMin);
            var xMax = Number(settings.xMax);
            var yMin = Number(settings.yMin);
            var yMax = Number(settings.yMax);
            var xStep = Math.abs(Number(settings.xStep)) || 1;
            var yStep = Math.abs(Number(settings.yStep)) || 5;
            if (!Number.isFinite(xMin)) xMin = -5;
            if (!Number.isFinite(xMax)) xMax = 5;
            if (!Number.isFinite(yMin)) yMin = -10;
            if (!Number.isFinite(yMax)) yMax = 30;
            if (xMax === xMin) xMax = xMin + 1;
            if (yMax === yMin) yMax = yMin + 1;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);

            function mathToCanvas(mx, my) {
              return {
                x: ((mx - xMin) / (xMax - xMin)) * width,
                y: height - ((my - yMin) / (yMax - yMin)) * height
              };
            }

            function drawStroke(stroke) {
              if (!Array.isArray(stroke) || stroke.length < 2) return;
              ctx.strokeStyle = "#2563eb";
              ctx.lineWidth = 2;
              ctx.lineCap = "round";
              ctx.lineJoin = "round";
              ctx.beginPath();
              stroke.forEach(function (point, index) {
                var canvasPoint = mathToCanvas(Number(point.x), Number(point.y));
                if (index === 0) ctx.moveTo(canvasPoint.x, canvasPoint.y);
                else ctx.lineTo(canvasPoint.x, canvasPoint.y);
              });
              ctx.stroke();
            }

            var origin = mathToCanvas(0, 0);
            ctx.font = "10px system-ui, sans-serif";
            ctx.fillStyle = "#64748b";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";

            for (var x = Math.ceil(xMin / xStep) * xStep; x <= xMax; x += xStep) {
              if (Math.abs(x) < 1e-9) continue;
              var px = mathToCanvas(x, 0).x;
              ctx.strokeStyle = "#f1f5f9";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(px, 0);
              ctx.lineTo(px, height);
              ctx.stroke();
              ctx.fillText(Number(x.toFixed(2)).toString(), px, Math.max(5, Math.min(height - 15, origin.y + 5)));
            }

            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            for (var y = Math.ceil(yMin / yStep) * yStep; y <= yMax; y += yStep) {
              if (Math.abs(y) < 1e-9) continue;
              var py = mathToCanvas(0, y).y;
              ctx.strokeStyle = "#f1f5f9";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(0, py);
              ctx.lineTo(width, py);
              ctx.stroke();
              ctx.fillText(Number(y.toFixed(2)).toString(), Math.max(20, Math.min(width - 5, origin.x - 5)), py);
            }

            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 2;
            if (origin.x >= 0 && origin.x <= width) {
              ctx.beginPath();
              ctx.moveTo(origin.x, 0);
              ctx.lineTo(origin.x, height);
              ctx.stroke();
            }
            if (origin.y >= 0 && origin.y <= height) {
              ctx.beginPath();
              ctx.moveTo(0, origin.y);
              ctx.lineTo(width, origin.y);
              ctx.stroke();
            }

            (Array.isArray(data?.drawings) ? data.drawings : []).forEach(drawStroke);
            (Array.isArray(data?.points) ? data.points : []).forEach(function (point) {
              var canvasPoint = mathToCanvas(Number(point.x), Number(point.y));
              ctx.beginPath();
              ctx.arc(canvasPoint.x, canvasPoint.y, 5, 0, Math.PI * 2);
              ctx.fillStyle = "#dc2626";
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1.5;
              ctx.stroke();
            });
          }

          function serializeNotesPanel() {
            var panel = document.getElementById("digitxt-notes-panel");
            var title = panel?.querySelector("#digitxt-note-title")?.value || "";
            var blocks = [];
            panel?.querySelectorAll("[data-note-block-id]").forEach(function (block) {
              var blockId = block.getAttribute("data-note-block-id");
              var type = block.getAttribute("data-note-block-type");
              if (type === "text") {
                blocks.push({ type: "text", html: block.querySelector("[contenteditable]")?.innerHTML || "" });
              } else if (type === "equation") {
                var field = block.querySelector("math-field");
                blocks.push({ type: "equation", latex: field?.value || "" });
              } else if (type === "table") {
                var rows = [];
                block.querySelectorAll("tr").forEach(function (row) {
                  rows.push(Array.prototype.map.call(row.querySelectorAll("input"), function (input) {
                    return input.value || "";
                  }));
                });
                blocks.push({ type: "table", data: rows });
              } else if (type === "graph") {
                blocks.push({
                  type: "graph",
                  settings: digitxtNoteBlocks[blockId]?.settings || { xMin: -5, xMax: 5, yMin: -10, yMax: 30, xStep: 1, yStep: 5 },
                  points: digitxtNoteBlocks[blockId]?.points || [],
                  drawings: digitxtNoteBlocks[blockId]?.drawings || []
                });
              }
            });
            return { type: "digitxt-note-document", version: 1, title: title, blocks: blocks };
          }

          function serializeNotesForSave() {
            return JSON.stringify(serializeNotesPanel());
          }

          function stylePanelButton(button, background, color) {
            button.style.border = "1px solid #dbe3ee";
            button.style.borderRadius = "0.45rem";
            button.style.background = background;
            button.style.color = color;
            button.style.padding = "0.42rem 0.65rem";
            button.style.font = "700 0.76rem Inter, system-ui, sans-serif";
            button.style.cursor = "pointer";
            button.style.lineHeight = "1";
          }

          function addNoteBlock(type, value, afterBlock) {
            var container = document.getElementById("digitxt-note-blocks");
            if (!container) return;
            var blockId = generateNoteId();
            var wrapper = document.createElement("div");
            wrapper.setAttribute("data-note-block-id", blockId);
            wrapper.setAttribute("data-note-block-type", type);
            wrapper.style.position = "relative";
            wrapper.style.padding = "0.75rem 0.85rem";
            wrapper.style.border = "1px solid #e6edf5";
            wrapper.style.borderRadius = "0.65rem";
            wrapper.style.background = "#ffffff";
            wrapper.style.boxShadow = "0 1px 2px rgba(15, 23, 42, 0.04)";

            var removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.textContent = "x";
            stylePanelButton(removeButton, "#ffffff", "#94a3b8");
            removeButton.style.position = "absolute";
            removeButton.style.top = "0.5rem";
            removeButton.style.right = "0.5rem";
            removeButton.style.width = "1.7rem";
            removeButton.style.height = "1.7rem";
            removeButton.style.padding = "0";
            removeButton.addEventListener("click", function () {
              delete digitxtNoteBlocks[blockId];
              wrapper.remove();
            });
            wrapper.appendChild(removeButton);

            var body = document.createElement("div");
            body.style.paddingRight = "2.1rem";

            if (type === "text") {
              var editable = document.createElement("div");
              editable.contentEditable = "true";
              editable.setAttribute("data-placeholder", "Write a note...");
              editable.innerHTML = value?.html || "";
              editable.style.minHeight = "2.35rem";
              editable.style.font = "0.96rem/1.65 Inter, system-ui, sans-serif";
              editable.style.color = "#1e293b";
              editable.style.outline = "none";
              editable.addEventListener("keydown", function (event) {
                if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "n") {
                  event.preventDefault();
                  event.stopPropagation();
                  addNoteBlock("text", { html: "" }, wrapper);
                }
              });
              body.appendChild(editable);
              setTimeout(function () { editable.focus(); }, 0);
            } else if (type === "equation") {
              var latex = value?.latex || "";
              var field = document.createElement("math-field");
              field.textContent = latex;
              field.value = latex;
              field.style.width = "100%";
              field.style.fontSize = "1.25rem";
              field.style.border = "0";
              field.style.outline = "none";
              field.style.background = "transparent";
              field.mathVirtualKeyboardPolicy = "manual";
              field.addEventListener("keydown", function (event) {
                if (event.key === "Enter" && !event.shiftKey) {
                  event.preventDefault();
                  event.stopPropagation();
                  addNoteBlock("equation", { latex: "" }, wrapper);
                }
              }, true);
              body.appendChild(field);
              loadExternalScript("https://unpkg.com/mathlive").then(function () {
                field.value = latex;
                setTimeout(function () { if (field.focus) field.focus(); }, 0);
              });
            } else if (type === "table") {
              var rows = Array.isArray(value?.data) && value.data.length ? value.data : [[""]];
              function renderTable(rowsToRender) {
                body.innerHTML = "";
                if (!rowsToRender.length) rowsToRender.push([""]);
                rowsToRender.forEach(function (row) {
                  if (!row.length) row.push("");
                });
                var table = document.createElement("table");
                table.style.borderCollapse = "collapse";
                table.style.marginBottom = "0.5rem";
                rowsToRender.forEach(function (row) {
                  var tr = document.createElement("tr");
                  row.forEach(function (cell, cellIndex) {
                    var td = document.createElement("td");
                    td.style.border = "1px solid #cbd5e1";
                    var input = document.createElement("input");

            }

            if (entry.chapterBookId && entry.chapterId) {
              throw new Error("The Supabase save tools did not load. Refresh this page, then try saving again.");
            }

            return saveActivityLocally(entry);
          }

          if (activityContext.studentMode && currentUser && currentUser.role === "student") {
            document.querySelectorAll("#digitxt-save-activity-button").forEach(function (button) {
              button.remove();
            });

            var notesPanel = ensureNotesPanel();

            var saveButton = document.createElement("button");
            saveButton.id = "digitxt-save-activity-button";
            saveButton.type = "button";
            saveButton.textContent = "Save";
            stylePanelButton(saveButton, "#16a34a", "#ffffff");
            saveButton.style.borderColor = "#15803d";
            saveButton.style.padding = "0.5rem 0.8rem";
            var headerActions = notesPanel.querySelector("[data-note-header-actions]");
            if (headerActions) {
              headerActions.insertBefore(saveButton, headerActions.firstChild);
            } else {
              notesPanel.appendChild(saveButton);
            }
            applySplitLayout(notesPanel);

            saveButton.addEventListener("click", async function () {
              saveButton.disabled = true;
              saveButton.textContent = "Saving...";

              try {
                var noteDocument = serializeNotesPanel();
                var notes = JSON.stringify(noteDocument);
                await saveActivity({
                  userId: currentUser.id,
                  chapterBookId: activityContext.chapterBookId,
                  chapterId: activityContext.chapterId,
                  bookTitle: activityContext.bookTitle,
                  chapterTitle: activityContext.chapterTitle,
                  content: notes,
                  activityState: { notes: notes, noteDocument: noteDocument },
                  metadata: {
                    username: currentUser.username,
                    savedFrom: "math-note-editor",
                    noteOnly: true,
                    chapterSavedAt: activityContext.chapterSavedAt
                  }
                });
                activityContext.notes = notes;
                activityContext.activityState = { notes: notes, noteDocument: noteDocument };
                showStatus("Your notes were saved.", "success");
              } catch (error) {
                console.error("Unable to save notes:", error);
                showStatus(error.message || "Unable to save notes.", "error");
              } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save";
              }
            });
          }
        })();
      <\/script>`;
    }

    function buildStudentStoreScripts(payload) {
      if (!payload?.studentMode) return "";

      return [
        '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></' + 'script>',
        '<script src="supabase-config.js"></' + 'script>',
        '<script src="supabase-store.js"></' + 'script>'
      ].join("");
    }

    function protectScriptEndTags(code) {
      const scriptOpenPattern = /<script\b[^>]*>/ig;
      let output = "";
      let cursor = 0;
      let openMatch = null;

      while ((openMatch = scriptOpenPattern.exec(code))) {
        output += code.slice(cursor, openMatch.index) + openMatch[0];

        let index = scriptOpenPattern.lastIndex;
        let quote = "";
        let escaped = false;

        while (index < code.length) {
          const lowerSlice = code.slice(index, index + 9).toLowerCase();

          if (quote && lowerSlice === "</" + "script>") {
            output += "<\\/script>";
            index += 9;
            escaped = false;
            continue;
          }

          if (!quote && lowerSlice === "</" + "script>") {
            output += code.slice(index, index + 9);
            index += 9;
            break;
          }

          const char = code[index];
          output += char;

          if (quote) {
            if (escaped) {
              escaped = false;
            } else if (char === "\\") {
              escaped = true;
            } else if (char === quote) {
              quote = "";
            }
          } else if (char === "'" || char === '"' || char === "`") {
            quote = char;
          }

          index += 1;
        }

        cursor = index;
        scriptOpenPattern.lastIndex = index;
      }

      return output + code.slice(cursor);
    }

    function setPreviewContent(code, chapterValue, payload) {
      if (loaded) return;
      loaded = true;
      hidePreviewSkeleton();
      if (token) {
        localStorage.removeItem(storagePrefix + token);
      }

      const anchor = chapterValue ? (chapterValue.startsWith("#") ? chapterValue : `#${chapterValue}`) : "";
      const pagePayload = payload || {};
      const injectedScripts =
        buildStudentStoreScripts(pagePayload) +
        (anchor ? `<script>window.location.hash = ${JSON.stringify(anchor)};<\/script>` : "") +
        buildFloatingControlsScript(pagePayload);
      const repairedCode = protectScriptEndTags(code);
      const bodyCloseMatches = Array.from(repairedCode.matchAll(/<\/body\s*>/ig));
      const lastBodyClose = bodyCloseMatches[bodyCloseMatches.length - 1];
      const html = lastBodyClose
        ? repairedCode.slice(0, lastBodyClose.index) + injectedScripts + repairedCode.slice(lastBodyClose.index)
        : repairedCode + injectedScripts;

      document.open();
      document.write(html);
      document.close();
    }

    function renderBookMenu(payload) {
      if (loaded) return;
      loaded = true;
      hidePreviewSkeleton();
      if (token) {
        localStorage.removeItem(storagePrefix + token);
      }
      const menuReturnHref = payload.studentMode
        ? "student-dashboard.html"
        : payload.teacherMode
          ? "teacher-dashboard.html"
          : "chapter-books.html";
      const menuReturnLabel = payload.studentMode
        ? "Back to Student Dashboard"
        : payload.teacherMode
          ? "Back to Dashboard"
          : "Back to Books";

      const menuHtml = `
        <style>
          html, body {
            margin: 0;
            min-height: 100%;
            background: #f8fafc;
            color: #111827;
            font-family: Inter, system-ui, sans-serif;
          }
          .app-shell {
            display: block;
            min-height: 100vh;
          }
          .topbar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(16px);
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
            z-index: 9999;
          }
          .topbar h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
          }
          .button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.65rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: none;
            white-space: nowrap;
          }
          .book-list {
            max-width: 1024px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
          }
          .book-list-item {
            padding: 1.25rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
          }
          .book-list-item h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
          }
          .book-list-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem 0.5rem;
            margin-top: 0.25rem;
            color: #6b7280;
            font-size: 0.875rem;
          }
          .open-page-button {
            background: #eff6ff;
            color: #2563eb;
            border: none;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
          }
          .empty-book-list {
            padding: 2rem;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            text-align: center;
            color: #6b7280;
          }
          @media (max-width: 640px) {
            .topbar,
            .book-list-item {
              align-items: stretch;
              flex-direction: column;
            }
            .button,
            .open-page-button {
              text-align: center;
            }
          }
        </style>
        <div class="app-shell">
          <div class="topbar">
            <div>
              <h1>${escapeHtml(payload.bookTitle)}</h1>
              <p style="margin: 0; font-size: 0.85rem; color: #4b5563;">Browse this book's saved HTML pages.</p>
            </div>
            <a href="${escapeHtml(menuReturnHref)}" class="button">${escapeHtml(menuReturnLabel)}</a>
          </div>
          <main style="padding: 1rem; overflow-y: auto;">
            <div class="book-list">
              ${payload.contents.length ? payload.contents.map((item, index) => {
                const savedAt = formatDate(item.savedAt);
                const details = [
                  item.author ? "by " + item.author : "",
                  item.year || "",
                  savedAt ? "Saved " + savedAt : "",
                  "HTML content from the book"
                ].filter(Boolean);

                return `
                  <article class="book-list-item">
                    <div>
                      <h2>${escapeHtml(item.title || "Chapter " + (index + 1))}</h2>
                      <div class="book-list-meta">
                        <span>Chapter ${index + 1}</span>
                        ${details.map((detail) => `<span aria-hidden="true">&middot;</span><span>${escapeHtml(detail)}</span>`).join("")}
                      </div>
                    </div>
                    <button class="open-page-button" data-item-index="${index}">Open</button>
                  </article>
                `;
              }).join("") : `<div class="empty-book-list">No HTML pages are available for this book.</div>`}
            </div>
          </main>
        </div>
      `;

      document.open();
      document.write(menuHtml);
      document.close();

      const onLoad = () => {
        document.querySelectorAll("button[data-item-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.getAttribute("data-item-index"));
            const item = payload.contents[index];
            if (!item) return;
            const token = `full-page-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const storageKey = `fullPagePreviewToken:${token}`;
            localStorage.setItem(storageKey, JSON.stringify({
              type: "fullPagePreview",
              content: item.content,
              chapter: null,
              studentMode: Boolean(payload.studentMode),
              teacherMode: Boolean(payload.teacherMode),
              chapterBookId: payload.chapterBookId || "",
              bookTitle: payload.bookTitle || "",
              chapterId: item.id || "",
              chapterTitle: item.title || "",
              activityState: item.activityState || {}
            }));
            const returnUrl = window.location.href;
            window.location.href = `full-page.html?token=${encodeURIComponent(token)}&returnTo=${encodeURIComponent(returnUrl)}&returnLabel=${encodeURIComponent("Return")}`;
          });
        });
      };

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", onLoad);
      } else {
        onLoad();
      }
    }

    async function loadChapterFromBookParams() {
      if (!bookId || !chapterId || !window.DigitxtStore?.listChapterBooks) {
        return false;
      }

      try {
        const books = await window.DigitxtStore.listChapterBooks();
        const book = books.find((entry) => entry.id === bookId);
        const contents = Array.isArray(book?.contents) ? book.contents : [];
        const chapterEntry = contents.find((entry, index) => (
          (entry.id || `chapter-${index + 1}`) === chapterId
        ));

        if (!book || !chapterEntry) {
          return false;
        }

        let latestEntry = {
          ...chapterEntry,
          id: chapterEntry.id || chapterId
        };

        if (urlStudentMode && window.DigitxtStore?.listStudentActivitySaves) {
          const user = window.DigitxtStore.getSession ? window.DigitxtStore.getSession() : null;
          if (user?.role === "student") {
            const saves = await window.DigitxtStore.listStudentActivitySaves(user.id);
            const latestCopy = saves
              .filter((activity) => (
                activity.chapterBookId === bookId &&
                activity.chapterId === latestEntry.id
              ))
              .sort((a, b) => (
                new Date(b.updatedAt || b.savedAt || 0).getTime() -
                new Date(a.updatedAt || a.savedAt || 0).getTime()
              ))[0];

            if (shouldUseStudentCopy(latestCopy, latestEntry)) {
              latestEntry = {
                ...latestEntry,
                savedAt: latestCopy.updatedAt || latestCopy.savedAt || latestEntry.savedAt || "",
                notes: latestCopy.metadata?.noteOnly ? latestCopy.content || "" : latestCopy.activityState?.notes || "",
                activityState: latestCopy.activityState || {},
                useSavedSnapshot: false
              };
            }
          }
        }

        const payload = {
          type: "fullPagePreview",
          content: latestEntry.content || "",
          chapter: null,
          studentMode: urlStudentMode,
          teacherMode: urlTeacherMode,
          chapterBookId: book.id || "",
          bookTitle: book.title || book.metadata?.title || "Chapter Book",
          chapterId: latestEntry.id || "",
          chapterTitle: latestEntry.title || "",
          chapterSavedAt: chapterEntry.savedAt || "",
          useSavedSnapshot: false,
          notes: latestEntry.notes || "",
          activityState: latestEntry.activityState || {}
        };

        if (!payload.content) {
          return false;
        }

        setPreviewContent(payload.content, payload.chapter, payload);
        return true;
      } catch (error) {
        console.error("Unable to load chapter from book:", error);
        return false;
      }
    }

    function loadPreview() {
      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || !event.data.type) return;

        if (event.data.type === "fullPagePreview" && event.data.content) {
          setPreviewContent(event.data.content, event.data.chapter, event.data);
        }

        if (event.data.type === "chapterBookMenu" && Array.isArray(event.data.contents)) {
          renderBookMenu(event.data);
        }
      });

      if (token) {
        const storageKey = storagePrefix + token;
        const stored = localStorage.getItem(storageKey);
        if (stored) {
          try {
            const payload = JSON.parse(stored);
            if (typeof payload === "string" && payload.trim()) {
              setPreviewContent(payload, chapter, { type: "fullPagePreview", content: payload, chapter });
              return;
            }
            if (payload && payload.type === "fullPagePreview" && payload.content) {
              setPreviewContent(payload.content, payload.chapter, payload);
              return;
            }
            if (payload && payload.type === "chapterBookMenu" && Array.isArray(payload.contents)) {
              renderBookMenu(payload);
              return;
            }
          } catch (err) {
            setPreviewContent(stored, chapter, { type: "fullPagePreview", content: stored, chapter });
            return;
          }
        }
      }

      if (bookId && chapterId) {
        loadChapterFromBookParams().then((didLoad) => {
          if (!didLoad && !loaded) {
            showError();
          }
        });
        return;
      }

      setTimeout(() => {
        if (!loaded) {
          showError();
        }
      }, 500);
    }

    loadPreview();
  </script>
