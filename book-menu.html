<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-store.js"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-sans antialiased">
  <div class="max-w-5xl mx-auto px-4 py-10 sm:px-6 lg:px-8">
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-8 pb-6 border-b border-gray-200">
      <div>
        <h1 id="book-title" class="text-3xl font-bold text-gray-900 tracking-tight">Book Menu</h1>
        <p class="text-gray-500 mt-2">Choose a chapter to open from this book.</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <a id="back-link" href="chapter-books.html" class="inline-flex items-center justify-center rounded-md bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
          Back to Books
        </a>
      </div>
    </header>

    <div id="empty-state" class="hidden rounded-xl border-2 border-dashed border-gray-300 p-12 text-center bg-white">
      <h3 class="mt-2 text-sm font-semibold text-gray-900">No HTML pages found</h3>
      <p class="mt-1 text-sm text-gray-500">This chapter book does not have any saved HTML content.</p>
    </div>

    <p id="status-box" class="hidden mb-5 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></p>

    <div id="files-list" class="flex flex-col gap-3 pb-8"></div>
  </div>

  <script>
    const storagePrefix = "bookMenuToken:";
    const fullPageStoragePrefix = "fullPagePreviewToken:";
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const bookId = params.get("bookId");
    const urlStudentMode = params.get("studentMode") === "1";
    const urlTeacherMode = params.get("teacherMode") === "1";
    const title = document.getElementById("book-title");
    const list = document.getElementById("files-list");
    const emptyState = document.getElementById("empty-state");
    const statusBox = document.getElementById("status-box");
    const backLink = document.getElementById("back-link");
    const activeUser = window.DigitxtStore?.getSession ? window.DigitxtStore.getSession() : null;
    let currentMenuPayload = null;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/\"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function setStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove("hidden");
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.classList.add("hidden");
    }

    function showMenuSkeletons() {
      emptyState.classList.add("hidden");
      list.innerHTML = Array.from({ length: 5 }).map(() => `
        <article class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
          <div class="h-5 w-2/3 animate-pulse rounded bg-gray-200"></div>
          <div class="mt-3 h-4 w-full max-w-lg animate-pulse rounded bg-gray-100"></div>
          <div class="mt-5 h-9 w-32 animate-pulse rounded-md bg-gray-200"></div>
        </article>
      `).join("");
    }

    function getMenuPayload() {
      if (!token) return null;
      const stored = localStorage.getItem(storagePrefix + token);
      if (!stored) return null;

      try {
        return JSON.parse(stored);
      } catch (error) {
        console.error("Unable to load book menu:", error);
        return null;
      }
    }

    function buildPayloadFromBook(entry) {
      return {
        bookTitle: entry.title || entry.metadata?.title || "Chapter Book",
        chapterBookId: entry.id || "",
        studentMode: urlStudentMode,
        teacherMode: urlTeacherMode || activeUser?.role === "teacher",
        contents: Array.isArray(entry.contents)
          ? entry.contents.map((item, index) => ({
              id: item.id || `chapter-${index + 1}`,
              title: item.title || `Chapter ${index + 1}`,
              author: item.author || "",
              year: item.year || "",
              savedAt: item.savedAt || "",
              content: item.content || ""
            }))
          : []
      };
    }

    async function loadMenuPayload() {
      const tokenPayload = getMenuPayload();
      if (tokenPayload) return tokenPayload;
      if (!bookId) {
        setStatus("Unable to open this book menu because no chapter book id was provided.");
        return null;
      }
      if (!window.DigitxtStore?.listChapterBooks) {
        setStatus("Unable to load chapter books. Refresh the page and try again.");
        return null;
      }

      const books = await window.DigitxtStore.listChapterBooks();
      const book = books.find((entry) => entry.id === bookId);
      if (!book) {
        setStatus("This chapter book could not be found. It may have been deleted or not finished saving.");
      }
      return book ? buildPayloadFromBook(book) : null;
    }

    function shouldUseStudentCopy(activity, entry) {
      return Boolean(activity);
    }

    async function getLatestStudentEntry(entry) {
      const menuPayload = currentMenuPayload || getMenuPayload();
      if (!menuPayload?.studentMode || !window.DigitxtStore?.listStudentActivitySaves) {
        return entry;
      }

      const user = window.DigitxtStore.getSession();
      if (!user || user.role !== "student") {
        return entry;
      }

      try {
        const saves = await window.DigitxtStore.listStudentActivitySaves(user.id);
        const latestCopy = saves.find((activity) => (
          activity.chapterBookId === (menuPayload.chapterBookId || "") &&
          activity.chapterId === (entry.id || "")
        ));

        if (!latestCopy) {
          return entry;
        }

        if (!shouldUseStudentCopy(latestCopy, entry)) {
          return entry;
        }

        const latestEntry = {
          ...entry,
          savedAt: latestCopy.updatedAt || latestCopy.savedAt || entry.savedAt || "",
          activityState: latestCopy.activityState || {}
        };

        const contents = Array.isArray(menuPayload.contents) ? menuPayload.contents : [];
        const nextPayload = {
          ...menuPayload,
          contents: contents.map((item) => (
            (item.id || "") === (entry.id || "") ? latestEntry : item
          ))
        };
        currentMenuPayload = nextPayload;
        if (token) {
          localStorage.setItem(storagePrefix + token, JSON.stringify(nextPayload));
        }

        return latestEntry;
      } catch (error) {
        console.error("Unable to refresh student copy:", error);
        return entry;
      }
    }

    async function openHtmlPage(entry) {
      const latestEntry = await getLatestStudentEntry(entry);
      const menuPayload = currentMenuPayload || getMenuPayload();
      const menuBookId = menuPayload?.chapterBookId || bookId || "";
      const studentMenuReturn = menuBookId
        ? `book-menu.html?bookId=${encodeURIComponent(menuBookId)}&studentMode=1`
        : "student-dashboard.html";
      if (menuPayload?.chapterBookId && latestEntry.id) {
        const returnTarget = menuPayload.studentMode ? studentMenuReturn : "chapter-books.html";
        const returnText = menuPayload.studentMode ? "Return to Book Menu" : "Back to Books";
        const directUrl = `full-page.html?bookId=${encodeURIComponent(menuPayload.chapterBookId)}&chapterId=${encodeURIComponent(latestEntry.id)}&studentMode=${menuPayload.studentMode ? "1" : "0"}&teacherMode=${menuPayload.teacherMode ? "1" : "0"}&returnTo=${encodeURIComponent(returnTarget)}&returnLabel=${encodeURIComponent(returnText)}`;
        window.location.href = directUrl;
        return;
      }

      const payload = {
        type: "fullPagePreview",
        content: latestEntry.content || "",
        chapter: null,
        studentMode: Boolean(menuPayload?.studentMode),
        chapterBookId: menuPayload?.chapterBookId || "",
        bookTitle: menuPayload?.bookTitle || "",
        chapterId: latestEntry.id || "",
        chapterTitle: latestEntry.title || "",
        activityState: latestEntry.activityState || {}
      };
      const previewToken = `full-page-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const storageKey = fullPageStoragePrefix + previewToken;
      let storedPayload = false;
      try {
        localStorage.setItem(storageKey, JSON.stringify(payload));
        storedPayload = true;
      } catch (error) {
        console.error("Unable to store full page preview payload:", error);
      }

      const returnTarget = menuPayload?.studentMode ? studentMenuReturn : "chapter-books.html";
      const returnText = menuPayload?.studentMode ? "Return to Book Menu" : "Back to Books";
      const url = storedPayload
        ? `full-page.html?token=${encodeURIComponent(previewToken)}&returnTo=${encodeURIComponent(returnTarget)}&returnLabel=${encodeURIComponent(returnText)}`
        : `full-page.html?returnTo=${encodeURIComponent(returnTarget)}&returnLabel=${encodeURIComponent(returnText)}`;
      if (storedPayload) {
        window.location.href = url;
      } else {
        alert("Unable to open this chapter because the browser could not store the preview data. Please close a few Digitxt tabs and try again.");
      }

      if (storedPayload) {
        setTimeout(() => {
          localStorage.removeItem(storageKey);
        }, 20000);
      }
    }

    async function renderMenu() {
      showMenuSkeletons();
      let payload = null;
      try {
        payload = await loadMenuPayload();
      } catch (error) {
        console.error("Unable to load book menu:", error);
        setStatus(error.message || "Unable to load this book menu.");
      }
      currentMenuPayload = payload;
      const contents = payload && Array.isArray(payload.contents) ? payload.contents : [];

      title.textContent = payload?.bookTitle || "Book Menu";
      if (payload) {
        clearStatus();
      }
      if (payload?.studentMode) {
        backLink.href = "student-dashboard.html";
        backLink.textContent = "Back to Student Dashboard";
      }

      if (!contents.length) {
        emptyState.classList.remove("hidden");
        list.innerHTML = "";
        return;
      }

      emptyState.classList.add("hidden");
      list.innerHTML = contents.map((file, index) => {
        const savedAt = formatDate(file.savedAt);
        const details = [
          file.author ? `by ${file.author}` : "",
          file.year || "",
          savedAt ? `Saved ${savedAt}` : ""
        ].filter(Boolean);

        return `
          <article class="flex flex-col sm:flex-row sm:items-center justify-between p-5 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-blue-300 transition-colors gap-4">
            <div>
              <h4 class="text-base font-semibold text-gray-900">${escapeHtml(file.title || `Chapter ${index + 1}`)}</h4>
              <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-gray-500 mt-1">
                <span>Chapter ${index + 1}</span>
                ${details.map((detail) => `<span aria-hidden="true">&middot;</span><span>${escapeHtml(detail)}</span>`).join("")}
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button data-open-id="${escapeAttribute(file.id || `chapter-${index + 1}`)}" class="text-sm font-medium text-blue-600 hover:text-blue-500 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-md transition-colors">Open</button>
            </div>
          </article>
        `;
      }).join("");

      list.querySelectorAll("button[data-open-id]").forEach((button) => {
        button.addEventListener("click", async () => {
          const item = contents.find((entry, index) => (entry.id || `chapter-${index + 1}`) === button.getAttribute("data-open-id"));
          if (item) {
            await openHtmlPage(item);
          }
        });
      });
    }

    renderMenu();
  </script>
</body>
</html>
